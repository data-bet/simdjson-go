name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  build:
    strategy:
      matrix:
        # The dependencies require 1.25.0, so go.mod does too; an older toolchain
        # cannot build this module without fetching a newer one.
        go-version: [1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test
      run: go test ./...

    - name: Test Noasm
      run: go test -tags=noasm ./...

    - name: Test Race
      env:
        CGO_ENABLED: 1
      run: go test -short -race ./...

  build-special:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Checkout code
      uses: actions/checkout@v4

    - name: fmt
      run: diff <(gofmt -d .) <(printf "")

    - name: Vet
      run: go vet ./...

    - name: Test 386
      run: GOOS=linux GOARCH=386 go test -short ./...

    # Separate module, so `go test ./...` from the root never reaches it and it can
    # break unnoticed - its go.sum drifting from the root module, for instance.
    - name: Vet benchmarks module
      working-directory: benchmarks
      run: go vet ./...
